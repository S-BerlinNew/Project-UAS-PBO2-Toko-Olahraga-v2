    <!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Aktivitas - Toko Olahraga</title>
    <link rel="icon" type="image/png" th:href="@{/assets/logo-baru.png}"/>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/main.css(v=2)}">
    <link rel="stylesheet" th:href="@{/css/logaktivitas.css}">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- ===== SIDEBAR ===== -->
        <aside th:replace="~{fragments/sidebar :: sidebar-fragments(activeMenu='log-aktivitas')}"></aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content">
            <!-- New Top Navbar -->
            <header class="top-navbar">
                <h1 class="page-title">Riwayat Aktivitas Pengguna</h1>
                
                <div class="navbar-right">
                    <!-- Notification icon removed -->
                    <div class="user-profile">
                        <div class="user-info">
                            <span class="welcome-text">Welcome</span>
                            <span class="user-name" th:text="${session.loggedInUser}">User</span>
                        </div>
                        <div class="avatar-circle"></div>
                    </div>
                </div>
            </header>

            <!-- Table Data Log -->
            <div class="main-data log-main-data">
                <div class="header-actions" style="margin-bottom: 15px;">
                    <p class="log-header-desc">Menampilkan semua riwayat aktivitas dari pengguna dalam sistem.</p>
                </div>
                
                <div class="table-wrapper-glass log-table-wrapper">
                    <table class="log-table">
                        <thead>
                            <tr>
                                <th class="log-th" style="width: 5%;">No.</th>
                                <th class="log-th" style="width: 20%;">Waktu</th>
                                <th class="log-th" style="width: 25%;">Nama Pengguna</th>
                                <th class="log-th" style="width: 50%;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="log, iterStat : ${listLog}" class="log-tr">
                                <td class="log-td" th:text="${iterStat.count}"></td>
                                <td class="log-td-time" th:text="${#temporals.format(log.waktu, 'dd MMM yyyy HH:mm:ss')}"></td>
                                <td class="log-td-user" th:text="${log.akun != null ? log.akun.namaLengkap : 'System'}"></td>
                                <td class="log-td-action">
                                    <span th:text="${log.aksi}"></span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listLog)}">
                                <td colspan="4" class="log-empty">Belum ada riwayat aktivitas!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
